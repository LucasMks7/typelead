name: Testes

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# O workflow só lê o código; não precisa de permissão de escrita.
permissions:
  contents: read

# Um push novo na mesma branch cancela a execução anterior, que ficou obsoleta.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      # Mostra todas as combinações que falharam, não apenas a primeira.
      fail-fast: false
      matrix:
        # O programa é usado no Windows; o Ubuntu pega o que depender do sistema.
        os: [windows-latest, ubuntu-latest]
        # A versão mínima declarada no pyproject.toml e a mais recente.
        python: ["3.10", "3.14"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # Sem o -e: assim os testes também conferem se a interface vai no pacote.
      - name: Instalar o projeto
        run: python -m pip install ".[dev]"

      - name: Rodar os testes
        run: python -m pytest -v

  javascript:
    name: JavaScript
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Rodar os testes
        run: node --test "tests/*.test.mjs"
