[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "typelead"
description = "Treino de inglês com vídeos: ouvir uma fala por vez e digitar o que entendeu, no próprio PC."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Lucas Marques de Assis" }]
dynamic = ["version"]
dependencies = [
    # Lê os dados e a legenda do vídeo. O YouTube muda sempre: manter atualizado.
    "yt-dlp>=2026.11",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
typelead = "typelead.servidor:main"

[tool.setuptools.dynamic]
version = { attr = "typelead.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
typelead = ["web/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
